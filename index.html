<style>html{background:#0E0F11}body{margin:0;background:transparent}</style>
<style>
body{margin:0}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
.rd{--ink:#0E0F11;--bone:#EDE8DF;--amber:#C8913A;--mute:rgba(237,232,223,.68);--rule:rgba(237,232,223,.18);--mute-d:rgba(14,15,17,.74);--rule-d:rgba(14,15,17,.22);position:relative;background:var(--ink);color:var(--bone);font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
.rd *,.rd *::before,.rd *::after{box-sizing:border-box}
.rd a{color:inherit}
.rd :focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.rd .light :focus-visible,.rd .cookie :focus-visible,.rd .intro :focus-visible{outline-color:var(--ink)}
.skip{position:absolute;left:12px;top:-80px;z-index:90;background:var(--bone);color:var(--ink);padding:12px 16px;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
.wrap{max-width:1320px;margin:0 auto;padding:0 22px}
.sec{padding:88px 0}
.h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:46px;line-height:1;letter-spacing:-.015em;margin:0}
.sub{color:var(--mute);margin:18px 0 0;max-width:44ch}
.sc{font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:15px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;background:var(--amber);color:var(--ink);font:600 16px/1 'Schibsted Grotesk',system-ui,sans-serif;text-decoration:none;border:0;border-radius:2px;cursor:pointer;transition:background-color .3s ease-out}
.btn:hover{background:#D9A550}
.tlink{display:inline-flex;align-items:center;min-height:44px;padding:0;background:none;border:0;color:inherit;font:500 16px/1 'Schibsted Grotesk',system-ui,sans-serif;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px;text-decoration-color:var(--amber);cursor:pointer}
.tlink:hover{text-decoration-thickness:2px}
.ln{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.ln>span{display:block}

.hdr{position:absolute;left:0;right:0;top:0;z-index:6;padding:20px 0}
.hdr-in{display:flex;justify-content:space-between;align-items:center;gap:24px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;min-height:44px}
.logo svg{flex:none;display:block}
.wm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:19px;letter-spacing:.3em}
.nav{display:none;gap:36px;font-size:15px}
.nav a{text-decoration:none;color:var(--mute);transition:color .3s}
.nav a:hover{color:var(--bone)}

.hero{position:relative}
.hero.is-pinned{height:300vh}
.stage{--a:0;--b:0;--c:0;--cl:0;--r:0;position:relative;height:clamp(600px,100vh,900px);container-type:size;overflow:hidden;background:var(--ink)}
.is-pinned .stage{position:sticky;top:0;height:100vh;height:100svh}
.space{position:absolute;inset:0;transform:scale(calc(1 + var(--a) * .9));transform-origin:50% 66%}
.space canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.limb{position:absolute;left:-45%;width:190%;aspect-ratio:1;top:48cqh;border-radius:50%;background:radial-gradient(closest-side,rgba(237,232,223,.05),rgba(237,232,223,.02));box-shadow:0 0 90px rgba(200,145,58,.24),inset 0 1.5px 0 rgba(237,232,223,.42),inset 0 50px 90px rgba(200,145,58,.1)}
.hero-copy{position:absolute;left:6cqw;top:50%;width:32cqw;z-index:4;transform:translateY(calc(-50% - var(--a) * 40px));opacity:calc(1 - var(--a) * 2.2)}
.prep{margin:0 0 18px;color:var(--amber)}
.h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:6.2cqw;line-height:.92;letter-spacing:-.02em;margin:0}
.h1 span{display:block}
.hero-sub{margin:2.6cqh 0 3.6cqh;color:var(--mute);font-size:18px;max-width:30ch}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.is-diving .hero-copy{pointer-events:none}
.hint{position:absolute;right:6cqw;top:50%;width:13ch;margin:0;padding-top:16px;border-top:1px solid var(--amber);color:var(--mute);line-height:1.3;z-index:4;opacity:calc(1 - var(--a) * 2.2)}
.win{--wh:56cqh;--ww:31.5cqh;--wl:calc(50cqw - 15.75cqh);--wt:22cqh;position:absolute;display:block;left:calc(var(--wl) * (1 - var(--c)));top:calc(var(--wt) * (1 - var(--c)));width:calc(var(--ww) + (100cqw - var(--ww)) * var(--c));height:calc(var(--wh) + (100cqh - var(--wh)) * var(--c));border-radius:calc(30px * (1 - var(--c)));overflow:hidden;padding:0;border:0;background:#1a1612;color:var(--bone);cursor:pointer;z-index:3;box-shadow:0 0 0 1px rgba(237,232,223,.42),0 0 140px rgba(200,145,58,.3),0 60px 120px -40px #000;text-align:left}
.rd .win:focus-visible{outline-offset:6px}
.scene{position:absolute;inset:0;transform:scale(calc(1 + var(--cl) * .35))}
.scene svg{display:block;width:100%;height:100%}
.clouds{position:absolute;inset:-25%;opacity:var(--cl);transform:scale(calc(1 + var(--b) * 1.4));filter:blur(14px);background:radial-gradient(38% 26% at 28% 38%,rgba(237,232,223,.95),transparent 70%),radial-gradient(44% 30% at 72% 30%,rgba(237,232,223,.9),transparent 70%),radial-gradient(50% 30% at 50% 68%,rgba(237,232,223,.92),transparent 72%),radial-gradient(30% 22% at 12% 76%,rgba(237,232,223,.8),transparent 70%),radial-gradient(34% 24% at 88% 74%,rgba(237,232,223,.85),transparent 70%)}
.glass{position:absolute;inset:0;opacity:calc(1 - var(--c));background:linear-gradient(118deg,rgba(237,232,223,.2) 0,rgba(237,232,223,0) 32%)}
.reelui{position:absolute;inset:0;opacity:var(--r);background:linear-gradient(rgba(14,15,17,0) 55%,rgba(14,15,17,.75))}
.rbar{position:absolute;left:22px;right:22px;top:22px;height:2px;background:rgba(237,232,223,.3)}
.rbar span{display:block;width:34%;height:100%;background:var(--bone)}
.rtag{position:absolute;left:28px;bottom:28px}
.rtag b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:38px;line-height:1}
.rtag .sc{color:var(--mute)}
@container (max-aspect-ratio: 1/1){
.win{--wh:44cqh;--ww:24.75cqh;--wl:calc(50cqw - 12.375cqh);--wt:11cqh}
.hero-copy{left:22px;right:22px;width:auto;top:auto;bottom:4cqh;transform:translateY(calc(var(--a) * 30px))}
.h1{font-size:12.6cqw}
.hero-sub{margin:14px 0 20px;font-size:17px}
.hint{display:none}
}

.proof{padding:104px 0}
.proof-q{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:40px;line-height:1.06;letter-spacing:-.012em;margin:0;max-width:19ch}
.src{margin:26px 0 0;font-size:13px;color:var(--mute)}
.how{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--rule)}
.how li{padding:26px 0;border-bottom:1px solid var(--rule);font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:30px;line-height:1.1}

.styles{padding:88px 0 72px;overflow:hidden}
.strip{position:relative;list-style:none;margin:36px 0 0;padding:44px calc(50% - 38vw);display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;perspective:1500px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip li{flex:none;width:76vw;scroll-snap-align:center;transform:translateZ(calc(var(--ad,0) * 150px)) rotateY(calc(var(--d,0) * -38deg))}
.sc-card{position:relative;display:block;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.still{position:relative;display:block;aspect-ratio:9/16;overflow:hidden;background:#1a1612;border-radius:3px}
.still .art{position:absolute;inset:0;width:100%;height:100%;animation:kb 9s ease-in-out infinite alternate;animation-play-state:paused}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-2%,-2%)}}
.sc-card:hover .art,.sc-card:focus-visible .art,.sc-card:active .art,.phone .art{animation-play-state:running}
.sc-card .still::after{content:'';position:absolute;inset:45% 0 0 0;background:linear-gradient(rgba(14,15,17,0),rgba(14,15,17,.88))}
.mosaic{position:absolute;inset:0;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:3px;background:var(--ink)}
.mosaic svg{display:block;width:100%;height:100%}
.word{position:absolute;left:10%;right:10%;top:30%;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:44px;line-height:1;color:var(--bone)}
.pres{position:absolute;inset:0;width:100%;height:100%}
.rv{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:#1a1612}
.view .rv{cursor:pointer}
.cap{position:absolute;left:18px;right:18px;bottom:18px;z-index:1}
.cap b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:30px;line-height:1.02}
.cap .sc{color:var(--mute)}

.ba{position:relative;aspect-ratio:4/5;overflow:hidden;margin-top:44px;background:#1a1612}
.ba svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ba-flat{filter:saturate(.28) brightness(1.22) contrast(.76)}
.ba-reel{position:absolute;inset:0}
.ba-lab{position:absolute;top:18px;padding:6px 10px;background:rgba(14,15,17,.82);font-size:14px;z-index:2}
.ba-lab.l{left:18px}.ba-lab.r{right:18px}
.ba-line{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:var(--bone);z-index:2;pointer-events:none}
.ba-line::after{content:'';position:absolute;left:-6px;top:50%;width:13px;height:60px;margin-top:-30px;background:var(--bone);border-radius:7px}
.ba input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:3}
.ba:has(input:focus-visible){outline:2px solid var(--amber);outline-offset:4px}

.light{background:var(--bone);color:var(--ink)}
.light .sub{color:var(--mute-d)}
.dev-grid{display:grid;gap:40px;align-items:center}
.dev-vis{position:relative;aspect-ratio:4/3;overflow:hidden;background:#8E8E8C}
.scn{position:absolute;inset:0}
.scn div{position:absolute}
.s-wall{left:0;right:0;top:0;height:62%}.s-floor{left:0;right:0;bottom:0;height:38%}.s-win{left:54%;top:12%;width:34%;height:42%}.s-island{left:10%;top:56%;width:52%;height:20%}.s-top{left:8%;top:54%;width:56%;height:3.5%}.s-pend{top:0;width:1px;height:26%}.s-shade{width:9%;height:5%;top:26%;border-radius:50% 50% 4px 4px}
.p1{left:22%}.p2{left:36%}.p3{left:50%}.sh1{left:17.5%}.sh2{left:31.5%}.sh3{left:45.5%}
.grey .s-wall{background:#A9A9A7}.grey .s-floor{background:#8D8D8B}.grey .s-win{background:#C8C8C6}.grey .s-island{background:#7B7B79}.grey .s-top,.grey .s-pend,.grey .s-shade{background:#6A6A68}
.fin .s-wall{background:linear-gradient(90deg,#D9CDB8,#E6DCCB)}.fin .s-floor{background:repeating-linear-gradient(90deg,#7A5A3E 0 11%,#6E5037 11% 22%)}.fin .s-win{background:linear-gradient(180deg,#B9C4C4,#F2E5C6);box-shadow:0 0 0 6px #2D2B28,0 0 120px 40px rgba(255,236,200,.45)}.fin .s-island{background:linear-gradient(180deg,#F3EFE7,#D8D1C4)}.fin .s-top,.fin .s-pend{background:#2D2B28}.fin .s-shade{background:#C8913A;box-shadow:0 18px 40px 6px rgba(255,214,150,.4)}
.fin{clip-path:inset(0 0 0 50%);animation:wipe 9s ease-in-out infinite}
@keyframes wipe{0%,10%{clip-path:inset(0 0 0 100%)}48%,62%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
.dv-lab{position:absolute;bottom:14px;padding:6px 10px;background:rgba(14,15,17,.82);color:var(--bone);font-size:14px}
.dv-lab.l{left:14px}.dv-lab.r{right:14px}
.smallprint{font-size:13px;color:var(--mute-d);margin:12px 0 0}

.menu{list-style:none;margin:44px 0 0;padding:0;border-top:1px solid var(--rule)}
.menu a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:baseline;padding:28px 0;border-bottom:1px solid var(--rule);text-decoration:none;transition:padding .6s cubic-bezier(.16,1,.3,1)}
.menu a:hover{padding-left:14px}
.m-name{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:34px;line-height:1}
.m-tag{display:block;color:var(--amber);margin-top:8px}
.m-desc{grid-column:1;color:var(--mute);font-size:15px}
.m-price{grid-row:1/3;grid-column:2;align-self:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:34px;line-height:1;text-align:right;white-space:nowrap;transition:color .3s}
.menu a:hover .m-price{color:var(--amber)}
.m-price small{font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:14px;color:var(--mute);margin-left:6px}

.sample{border-top:1px solid var(--rule)}
.sample-grid{display:grid;gap:48px}
.form{display:grid;gap:28px}
.row{display:grid;gap:28px}
.f label{display:block;font-size:14px;color:var(--mute);margin-bottom:2px}
.f input,.f select{display:block;width:100%;min-height:48px;padding:6px 0;background:transparent;border:0;border-bottom:1px solid rgba(237,232,223,.55);border-radius:0;color:var(--bone);font:inherit;font-size:18px}
.f input:focus,.f select:focus{border-bottom-color:var(--amber)}
.f select option{color:#0E0F11}
.note{font-size:14px;color:var(--mute);margin:0}
.done h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:44px;line-height:1;margin:0 0 16px}
.done p{margin:0;color:var(--mute);max-width:40ch}
.phone{width:min(64vw,290px);aspect-ratio:9/16;border-radius:38px;padding:8px;background:#000;box-shadow:0 0 0 1px rgba(237,232,223,.3),0 0 120px rgba(200,145,58,.18)}
.phone .still{height:100%;aspect-ratio:auto;border-radius:30px}
.slot{margin-top:36px}
.wmark{position:absolute;left:-20%;right:-20%;top:46%;text-align:center;transform:rotate(-24deg);font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;letter-spacing:.3em;color:rgba(237,232,223,.6);white-space:nowrap}
.slot-cap{margin:14px 0 0;font-size:14px;color:var(--mute)}

.ftr{border-top:1px solid var(--rule);padding:40px 0 0;overflow:hidden}
.ftr-meta{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px;color:var(--mute);list-style:none;margin:0;padding:0}
.ftr-meta a{color:var(--bone);text-underline-offset:4px;display:inline-flex;min-height:44px;align-items:center}
.ftr-meta li{display:inline-flex;min-height:44px;align-items:center}
.giant{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:19.6vw;line-height:.74;letter-spacing:.02em;margin:40px 0 -.2em;white-space:nowrap;text-align:center;user-select:none}

.cookie{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bone);color:var(--ink);padding:10px 22px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;font-size:14px}
.cookie p{margin:0;flex:1 1 260px}
.ck-btns{display:flex;gap:10px}
.ck{min-height:44px;min-width:104px;padding:0 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 14px/1 'Schibsted Grotesk',system-ui,sans-serif;border-radius:2px;cursor:pointer}
.ck:hover{background:var(--ink);color:var(--bone)}

.view{position:fixed;left:0;right:0;top:0;height:min(100vh,1100px);z-index:60;background:rgba(14,15,17,.97);display:grid;place-items:center;padding:76px 22px 28px;overflow:auto}
.view-in{display:grid;gap:28px;justify-items:center;width:100%;max-width:980px}
.view-x{position:absolute;top:16px;right:22px}
.v-body{width:100%;max-width:420px}
.v-name{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:46px;line-height:1;margin:0}
.v-meta{display:block;color:var(--amber);margin-top:10px}
.v-desc{color:var(--mute);margin:14px 0 24px;max-width:34ch}
.v-nav{display:flex;gap:28px;margin-top:20px;color:var(--mute)}

.grain{position:fixed;left:0;top:0;width:100%;height:min(100vh,1200px);z-index:50;pointer-events:none;opacity:.1;mix-blend-mode:soft-light}
.intro{position:fixed;left:0;right:0;top:0;height:min(100vh,1100px);z-index:100;background:var(--bone);color:var(--ink);display:grid;place-items:center;transition:opacity .45s ease-out}
.intro.is-leaving{opacity:0}
.intro video{display:block;width:min(86vw,62vh,620px);aspect-ratio:1;object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 78%,transparent 100%)}
.intro .tlink{position:absolute;right:22px;bottom:18px;text-decoration-color:var(--ink)}

.rv-on [data-rv]{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.rv-on [data-rv].in{opacity:1;transform:none}
.rv-on [data-rv="img"]{opacity:1;transform:none;clip-path:inset(9% 9% 9% 9%);transition:clip-path .9s cubic-bezier(.16,1,.3,1)}
.rv-on [data-rv="img"].in{clip-path:inset(0)}
.rv-on [data-rv="lines"]{opacity:1;transform:none}
.rv-on [data-rv="lines"] .ln>span{transform:translateY(110%);transition:transform .85s cubic-bezier(.16,1,.3,1)}
.rv-on [data-rv="lines"].in .ln>span{transform:none}
.ln:nth-child(2)>span{transition-delay:.09s}.ln:nth-child(3)>span{transition-delay:.18s}.ln:nth-child(4)>span{transition-delay:.27s}
@media (prefers-reduced-motion: reduce){.rd *,.rd *::before,.rd *::after{animation:none!important;transition:none!important}.fin{clip-path:inset(0 0 0 50%)}}

@media (min-width:600px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){
.wrap{padding:0 56px}
.sec{padding:150px 0}
.h2{font-size:84px}
.nav{display:flex}
.hdr{padding:28px 0}
.wm{font-size:21px}
.proof{padding:170px 0}
.proof-q{font-size:84px}
.how{grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--rule)}

.how li:last-child{border-right:0}
.styles{padding:150px 0 110px}
.strip{padding:56px calc(50% - 125px);gap:28px;scroll-snap-type:none;cursor:grab}
.strip.is-drag{cursor:grabbing}
.strip li{width:250px}
.ba{aspect-ratio:16/8;margin-top:64px}
.dev-grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:88px}
.menu{margin-top:64px}
.menu a{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;padding:38px 0}
.m-name{font-size:54px}
.m-tag{display:inline;margin:0 0 0 18px}
.m-desc{grid-column:2;grid-row:1;font-size:17px}
.m-price{grid-column:3;grid-row:1;font-size:54px}
.sample-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:110px}
.view-in{grid-template-columns:auto minmax(0,1fr);gap:96px;align-items:center;justify-items:start}
.view .phone{width:330px}
.v-name{font-size:84px}
.ftr-meta{justify-content:space-between}
}

.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.hero2{position:relative;width:100%;height:100vh;height:100svh;min-height:420px;max-height:2400px;overflow:hidden;container-type:size;background:#020308 url("a/d36f0d674979.webp") center/cover no-repeat;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cover{position:absolute;left:50%;top:50%;width:max(100cqw,177.78cqh);height:max(100cqh,56.25cqw);transform:translate(-50%,-50%)}
.is-playing .cover,.is-ended .cover{visibility:hidden;transition:visibility 0s .25s}

.fb{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
