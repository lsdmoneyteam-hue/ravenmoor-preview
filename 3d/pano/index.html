<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halden penthouse walk-through</title>
<style>
/* VOICE quiet viewing room; IDEA walking a show flat; PICTURE the panorama fills the screen; COLOUR near-black with brass; TYPE system sans; LAYOUT full bleed, spot list at the foot */
:root{color-scheme:dark;--ink:#efe9de;--brass:#c9a15a;--bg:#0e0f11}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#v{position:fixed;inset:0;touch-action:none;cursor:grab}
#v:active{cursor:grabbing}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
.top{position:fixed;left:16px;top:14px;right:16px;display:flex;gap:10px;align-items:baseline;pointer-events:none;text-shadow:0 1px 6px #000}
.top h1{font-size:16px;font-weight:600;margin:0}
.top span{font-size:13px;opacity:.85}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:4px;max-width:calc(100% - 20px);background:rgba(14,15,17,.72);backdrop-filter:blur(8px);padding:5px;border-radius:22px;border:1px solid rgba(255,255,255,.14)}
.bar button{font:inherit;color:var(--ink);background:none;border:0;border-radius:18px;padding:10px 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.bar button.on{background:var(--brass);color:#17191d;font-weight:600}
.bar .sep{width:1px;background:rgba(255,255,255,.2);margin:6px 2px}
.bar button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#msg{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:14px;opacity:.85}
@media(max-width:600px){.top{flex-direction:column;gap:2px}.top span{font-size:12px}.bar button{padding:9px 11px;font-size:14px}}
</style>
</head>
<body>
<canvas id="v" aria-label="360 degree view of the penthouse. Drag to look around; tap an arrow to move."></canvas>
<div id="fade"></div>
<div class="top"><h1>Halden Tower · the penthouse</h1><span>Demo, fictional development · drag to look, tap a marker on the floor to move</span></div>
<div class="bar" role="group" aria-label="Where to stand">
  <button type="button" data-spot="gr">Great room</button>
  <button type="button" data-spot="dining">Kitchen</button>
  <button type="button" data-spot="b1">Main bedroom</button>
  <button type="button" data-spot="dress">Dressing room</button>
  <button type="button" data-spot="bath">Bathroom</button>
  <button type="button" data-spot="b2">Bedroom 2</button>
  <button type="button" data-spot="bath2">Shower room</button>
  <button type="button" data-spot="b3">Bedroom 3</button>
  <button type="button" data-spot="stair">Stair</button>
  <button type="button" data-spot="landing">Landing</button>
  <button type="button" data-spot="spa">Roof spa</button>
  <button type="button" data-spot="garden">Fire pit</button>
  <button type="button" data-spot="terrace">Terrace</button>
  <button type="button" data-spot="bar">Bar</button>
  <button type="button" data-spot="pool">Pool</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="b-look">3D model</button>
</div>
<div id="msg">Loading…</div>
<script type="module">
import * as THREE from '/3d/lib/three.module.js';
{
const CF = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KYm4CUx2KmRR6KYMbDFJRWRKcU/';
// where each panorama was taken in the 3D model (metres), the photo, and what it links to
const SPOTS = {
  gr:      { name: 'Great room', pos: [-10.4, 80.35, 5.2],  photo: CF + '81d24921-49e0-42b7-a359-ecb4357f199d.jpg', face: [-4, 80.35, 1.5],   links: [['stair', 'Stair'], ['landing', 'Up to the landing'], ['dining', 'Kitchen and dining'], ['b1', 'Main bedroom']] },
  stair:   { name: 'Stair',      pos: [-12.3, 80.35, 3.7],  photo: CF + 'b3bae532-8fbe-4985-9a75-c7931d0488d0.jpg', face: [-7.6, 83.5, 1.75], links: [['landing', 'Up the stair'], ['gr', 'Great room']] },
  landing: { name: 'Landing',    pos: [-5.6, 83.5, 1.75],   photo: CF + 'ea63c860-9384-4a89-a6e6-bbbe38dd12e4.jpg', face: [5, 83.5, 3],       links: [['terrace', 'Out to the terrace'], ['stair', 'Down the stair'], ['spa', 'Roof spa'], ['garden', 'Fire pit']] },
  terrace: { name: 'Terrace',    pos: [-1.5, 83.5, 2.0],    photo: CF + '5e4dd1ce-62fe-43a6-bc10-36fcb917fae9.jpg', face: [8, 84, 5],         links: [['bar', 'The bar'], ['pool', 'Up to the pool'], ['landing', 'Back inside'], ['garden', 'Fire pit']] },
  bar:     { name: 'Bar',        pos: [6.5, 83.5, -1.0],    photo: CF + '985c48cb-13fe-46dc-855d-df84631a0154.jpg', face: [8, 83.5, -3.5],    links: [['pool', 'Up to the pool'], ['terrace', 'Terrace'], ['spa', 'Roof spa']] },
  pool:    { name: 'Pool',       pos: [7.4, 84.85, 4.95],   photo: CF + '651dd615-0938-4a2b-a031-b3d847ed0803.jpg', face: [14, 84.85, 7],     links: [['bar', 'Down to the bar'], ['terrace', 'Terrace']] },
  dining:  { name: 'Kitchen',    pos: [1.2, 80.35, 6.2],    photo: CF + 'fccb0113-0925-4a88-805f-183ca1834768.jpg', face: [-1, 80.35, 2],     links: [['gr', 'Great room'], ['b2', 'Bedroom 2'], ['b3', 'Bedroom 3']] },
  b1:      { name: 'Main bedroom', pos: [-11.25, 80.35, -5.5], photo: CF + '8901c15e-58f6-41d3-bed5-e23b371d26c9.jpg', face: [-8, 80.35, -7],  links: [['bath', 'Bathroom'], ['dress', 'Dressing room'], ['gr', 'Great room']] },
  bath:    { name: 'Bathroom',   pos: [-5, 80.35, -6.5],    photo: CF + '0052796b-0f12-4358-8285-468d466acd0d.jpg', face: [-3, 80.35, -8],    links: [['b1', 'Main bedroom'], ['dress', 'Dressing room']] },
  dress:   { name: 'Dressing room', pos: [-6.7, 80.35, -2.75], photo: CF + 'bfc8a432-0720-4efe-9d4a-7085c0193f24.jpg', face: [-3.5, 80.35, -2.75], links: [['b1', 'Main bedroom'], ['bath', 'Bathroom']] },
  b2:      { name: 'Bedroom 2',  pos: [5.5, 80.35, -5],     photo: CF + 'b22b2e5f-e98c-451a-8fa8-bfcd052d28f8.jpg', face: [7, 80.35, -8],     links: [['bath2', 'Shower room'], ['b3', 'Bedroom 3'], ['dining', 'Kitchen']] },
  b3:      { name: 'Bedroom 3',  pos: [13.6, 80.35, -2.2],  photo: CF + 'bf404078-fe54-4e49-806e-ceedb2c1117c.jpg', face: [12, 80.35, -7],    links: [['b2', 'Bedroom 2'], ['dining', 'Kitchen']] },
  bath2:   { name: 'Shower room', pos: [9.75, 80.35, -7],   photo: CF + '21d890b7-fbb8-43b7-9607-f33197c2a2bd.jpg', face: [9.75, 80.35, -9], links: [['b2', 'Bedroom 2']] },
  spa:     { name: 'Roof spa',   pos: [10.5, 83.5, -6.5],   photo: CF + '03376625-803e-4295-9058-67169ea97d2c.jpg', face: [10.5, 83.5, -9],   links: [['landing', 'Landing'], ['bar', 'The bar']] },
  garden:  { name: 'Fire pit',   pos: [-9, 83.5, -4],       photo: CF + '282c1fd5-9681-4de8-b449-229f3af96079.jpg', face: [-12, 83.5, -6],    links: [['landing', 'Landing'], ['terrace', 'Terrace']] },
};
const cv = document.getElementById('v'), msg = document.getElementById('msg'), fade = document.getElementById('fade');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(75, 1, .1, 100);
const geo = new THREE.SphereGeometry(10, 96, 64); geo.scale(-1, 1, 1);
const mat = new THREE.MeshBasicMaterial({ color: 0xffffff }); scene.add(new THREE.Mesh(geo, mat));
const L = new THREE.TextureLoader(); L.setCrossOrigin('anonymous');
const cache = {};
const load = url => cache[url] || (cache[url] = new Promise((ok, bad) => L.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = r.capabilities.getMaxAnisotropy(); ok(t); }, undefined, bad)));
// a world direction to a point on the sphere, matching how the panoramas were stitched (longitude 0 = looking along -Z)
const D = (from, to) => { const d = new THREE.Vector3(to[0] - from[0], to[1] - from[1], to[2] - from[2]).normalize(); return { lon: Math.atan2(d.x, -d.z), lat: Math.asin(d.y) }; };
const onSphere = ({ lon, lat }, rad = 9) => new THREE.Vector3(-Math.cos(lon) * Math.cos(lat) * rad, Math.sin(lat) * rad, -Math.sin(lon) * Math.cos(lat) * rad);
const viewLon = lon => lon * 180 / Math.PI + 180;
// a marker on the floor in the direction of the next spot, like a walk-through: a brass ring with an arrow and a small label
function marker(text, h, ang) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.RingGeometry(.26, .36, 48), new THREE.MeshBasicMaterial({ color: 0xc9a15a, transparent: true, opacity: .95, depthTest: false }));
  const disc = new THREE.Mesh(new THREE.CircleGeometry(.26, 48), new THREE.MeshBasicMaterial({ color: 0x0e0f11, transparent: true, opacity: .45, depthTest: false }));
  const sh = new THREE.Shape(); sh.moveTo(0, .16); sh.lineTo(.12, -.06); sh.lineTo(.04, -.02); sh.lineTo(.04, -.14); sh.lineTo(-.04, -.14); sh.lineTo(-.04, -.02); sh.lineTo(-.12, -.06); sh.closePath();
  const arrow = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshBasicMaterial({ color: 0xefe9de, depthTest: false }));
  const flat = new THREE.Group(); flat.add(disc, ring, arrow); flat.rotation.x = -Math.PI / 2; flat.rotation.z = ang; g.add(flat);
  const c = document.createElement('canvas'), x = c.getContext('2d'), sc = 2; c.width = 300 * sc; c.height = 56 * sc; x.scale(sc, sc);
  x.font = '600 22px system-ui, sans-serif'; const w = Math.min(290, x.measureText(text).width + 32);
  x.fillStyle = 'rgba(14,15,17,.75)'; x.beginPath(); x.roundRect(150 - w / 2, 6, w, 44, 22); x.fill();
  x.fillStyle = '#efe9de'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 150, 29);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true })); lab.scale.set(1.0, .19, 1); lab.position.y = .32; g.add(lab);
  g.position.copy(h); g.renderOrder = 3; g.traverse(o => { o.renderOrder = 3; });
  return g;
}
const EYE = 1.6;
let cur = null, model = false, lon = 90, lat = 0, fov = innerWidth < innerHeight ? 108 : 75, dirty = true, hot = [];
async function go(id, keepView) {
  const s = SPOTS[id]; if (!s) return;
  fade.classList.add('on'); msg.textContent = '';
  let tex;
  try { tex = await load(model ? `/3d/pano/${id}_model.jpg` : s.photo); } catch (e) { try { tex = await load(`/3d/pano/${id}_model.jpg`); } catch (e2) { msg.textContent = 'This view did not load.'; } }
  if (!tex) { fade.classList.remove('on'); return; }
  await new Promise(res => setTimeout(res, cur ? 250 : 0));
  mat.map = tex; mat.needsUpdate = true;
  hot.forEach(h => scene.remove(h)); hot = [];
  for (const [to, text] of s.links) {
    const t = SPOTS[to].pos, dx = t[0] - s.pos[0], dz = t[2] - s.pos[2], dist = Math.hypot(dx, dz), lon = Math.atan2(dx / dist, -dz / dist), d = Math.min(Math.max(dist * .6, 1.6), 2.8);
    const h = new THREE.Vector3(-Math.cos(lon) * d, -EYE, -Math.sin(lon) * d), m = marker(text, h, Math.atan2(-h.x, -h.z));
    m.userData.to = to; m.traverse(o => { o.userData.to = to; }); scene.add(m); hot.push(m);
  }
  if (!keepView) { const f = D(s.pos, s.face); lon = viewLon(f.lon); lat = Math.max(-20, Math.min(20, f.lat * 180 / Math.PI)); }
  cur = id; dirty = true;
  document.querySelectorAll('[data-spot]').forEach(b => { b.classList.toggle('on', b.dataset.spot === id); if (b.dataset.spot === id) b.scrollIntoView({ inline: 'center', block: 'nearest' }); });
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  fade.classList.remove('on');
  for (const [to] of s.links) load(model ? `/3d/pano/${to}_model.jpg` : SPOTS[to].photo).catch(() => {});
}
document.querySelectorAll('[data-spot]').forEach(b => b.onclick = () => go(b.dataset.spot));
const lookBtn = document.getElementById('b-look');
lookBtn.onclick = () => { model = !model; lookBtn.classList.toggle('on', model); go(cur, true); };
function size() { const w = innerWidth, h = innerHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); dirty = true; }
addEventListener('resize', size); size();
const pts = new Map(); let pinch0 = 0, fov0 = fov, moved = 0;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); fov0 = fov; } });
cv.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1) { const k = fov / innerHeight; lon -= (e.clientX - p.x) * k; lat += (e.clientY - p.y) * k; moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y); }
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); fov = Math.min(115, Math.max(35, fov0 * pinch0 / d)); moved = 99; }
  dirty = true;
});
cv.addEventListener('pointerup', e => {
  pts.delete(e.pointerId);
  if (moved < 8 && hot.length) { ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, cam); const h = ray.intersectObjects(hot, true)[0]; if (h) go(h.object.userData.to); }
});
cv.addEventListener('pointercancel', e => pts.delete(e.pointerId));
cv.addEventListener('wheel', e => { e.preventDefault(); fov = Math.min(115, Math.max(35, fov + e.deltaY * .04)); dirty = true; }, { passive: false });
addEventListener('keydown', e => { const s = 4; if (e.key === 'ArrowLeft') lon -= s; else if (e.key === 'ArrowRight') lon += s; else if (e.key === 'ArrowUp') lat += s; else if (e.key === 'ArrowDown') lat -= s; else return; dirty = true; });
window.__look = (a, b, f) => { lon = a; lat = b; if (f) fov = f; dirty = true; };
window.__go = id => go(id);
(function tick() {
  requestAnimationFrame(tick); if (!dirty) return; dirty = false;
  lat = Math.max(-85, Math.min(85, lat)); cam.fov = fov; cam.updateProjectionMatrix();
  const ph = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon);
  cam.lookAt(10 * Math.sin(ph) * Math.cos(th), 10 * Math.cos(ph), 10 * Math.sin(ph) * Math.sin(th));
  r.render(scene, cam);
})();
go(SPOTS[location.hash.slice(1)] ? location.hash.slice(1) : 'gr');
}
</script>
</body>
</html>
